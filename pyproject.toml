[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "incident.log"
version = "0.2.0"
description = "An incident register for AI systems: risk scoring, acknowledge/mitigate/resolve targets with pausable clocks, escalation, GDPR / EU AI Act / NIS2 reporting clocks, detection and response metrics, repeat-failure detection, and postmortems that list their own gaps. Dependency-free Python."
classifiers = ["Typing :: Typed", "Programming Language :: Python :: 3", "License :: OSI Approved :: MIT License"]
keywords = ["incident-response", "postmortem", "sla", "ai-governance", "eu-ai-act", "gdpr", "nis2"]
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "AndMaverick LLC" }]

[tool.setuptools.packages.find]
include = ["incident_log*"]

[tool.setuptools.package-data]
incident_log = ["py.typed"]

[project.scripts]
incident-log = "incident_log.cli:main"

[tool.ruff]
line-length = 130
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
strict = true
files = ["incident_log"]
