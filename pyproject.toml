[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "incident.log"
version = "0.1.0"
description = "An AI incident register: risk scoring with detectability, SLA tracking by severity, MTTR, and postmortem generation. Dependency-free Python."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "AndMaverick LLC" }]

[tool.setuptools.packages.find]
include = ["incident_log*"]
